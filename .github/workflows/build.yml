name: Build MeiMei Client (Raw Compile)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

            - name: Download ImGui
        run: |
          git clone --depth 1 https://github.com/ocornut/imgui.git
          cd imgui
          git checkout master

      - name: Compile Client
        run: |
          cl.exe /LD /EHsc /std:c++17 /I./imgui /I./imgui/backends MeiMei_Client_Unlinked_Full.cpp imgui/*.cpp imgui/backends/imgui_impl_win32.cpp imgui/backends/imgui_impl_dx11.cpp /link d3d11.lib /OUT:MeiMei_Client.dll

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MeiMei_Client_v5_Unlinked
          path: MeiMei_Client.dll
          retention-days: 7
