name: Build Orion Drift Mod (Android ARM64 + Valid Pak)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
          add-to-path: true

      - name: Download ImGui
        run: |
          git clone --depth 1 https://github.com/ocornut/imgui.git
          cd imgui
          git checkout master

      - name: Compile Android ARM64 Shared Object
        run: |
          export CC=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++
          $CC -shared -fPIC -O3 -std=c++17 \
            -I./imgui -I./imgui/backends \
            MeiMei_Client_Android.cpp \
            imgui/*.cpp imgui/backends/imgui_impl_opengl3.cpp \
            -lEGL -lGLESv3 -llog \
            -o libMeiMei.so

      - name: Package for Driftrinth (Valid Pak Structure)
        run: |
          # Create the inner pak structure
          mkdir -p PakContent/lib/arm64-v8a
          cp libMeiMei.so PakContent/lib/arm64-v8a/
          
          # Create the .pak file (many UE loaders accept standard zips renamed to .pak)
          cd PakContent
          zip -r ../MeiMei.pak .
          cd ..
          
          # Create the final upload zip
          mkdir -p Driftrinth_Upload
          cp MeiMei.pak Driftrinth_Upload/
          cd Driftrinth_Upload
          zip -r ../MeiMei_OrionDrift_Mod.zip .

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MeiMei_OrionDrift_Mod
          path: MeiMei_OrionDrift_Mod.zip
          retention-days: 7
