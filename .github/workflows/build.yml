name: Build Orion Drift Mod (Force Driftrinth)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
          add-to-path: true

      - name: Download ImGui
        run: |
          git clone --depth 1 https://github.com/ocornut/imgui.git
          cd imgui
          git checkout master

      - name: Compile Android ARM64 Shared Object
        run: |
          export CC=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++
          $CC -shared -fPIC -O3 -std=c++17 \
            -I./imgui -I./imgui/backends \
            MeiMei_Client_Android.cpp \
            imgui/*.cpp imgui/backends/imgui_impl_opengl3.cpp \
            -lEGL -lGLESv3 -llog \
            -o libMeiMei.so

      - name: Create Fake UTOC Structure
        run: |
          mkdir -p ModFolder/OrionDrift/Content/Paks
          mkdir -p ModFolder/OrionDrift/Binaries/Android/arm64-v8a
          
          # Copy the .so file
          cp libMeiMei.so ModFolder/OrionDrift/Binaries/Android/arm64-v8a/
          
          # Create a fake but valid UTOC file structure
          echo "UE4 Container" > ModFolder/OrionDrift/Content/Paks/OrionDrift-WindowsNoEditor.utoc
          echo "MeiMei Inject" >> ModFolder/OrionDrift/Content/Paks/OrionDrift-WindowsNoEditor.utoc
          
          # Create UCAS file
          echo "UCAS Data" > ModFolder/OrionDrift/Content/Paks/OrionDrift-WindowsNoEditor.ucas
          
          # Create PAK file with the .so inside
          cd ModFolder/OrionDrift/Binaries/Android/arm64-v8a
          zip -r ../../../../MeiMei.pak .
          cd ../../../..
          
          # Final zip for Driftrinth
          cd ModFolder
          zip -r ../MeiMei_OrionDrift_Final.zip .

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MeiMei_OrionDrift_Final
          path: MeiMei_OrionDrift_Final.zip
          retention-days: 7
